name: tests
on: [push, pull_request]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python tests/make_synthetic_dataset.py --output synthetic_demo.p
      - run: python src/data_processing.py --input synthetic_demo.p --output_dir outputs
